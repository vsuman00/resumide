name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - run: npm run scan:secrets
      - run: npm run check:alerts
      - run: npm run check:container
      - run: npm run format:check
      - run: npm run format:check:native-layout
      - run: npm run check:ocr:pilot-source
      - run: npm run check:aa2:source
      - run: npm run check:aa3:source
      - run: npm run check:aa4:source
      - run: npm run check:aa5:source
      - run: npm run lint
      - run: npm run test
      - run: npm run test:load
      - run: npm run test:restore
      - run: npm run benchmark:phase5
      - run: npm run benchmark:native-layout
      - run: npm run benchmark:scoring-validity
      - run: npm run benchmark:writer-grounding
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  browser:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx supabase start
      - name: Configure browser Supabase fixture
        shell: bash
        run: |
          status="$(npx supabase status -o env)"
          value() {
            printf '%s\n' "$status" | awk -F= -v key="$1" '$1 == key { sub(/^"/, "", $2); sub(/"$/, "", $2); print $2; exit }'
          }
          {
            echo "SUPABASE_URL=$(value API_URL)"
            echo "SUPABASE_PUBLISHABLE_KEY=$(value PUBLISHABLE_KEY)"
            echo "SUPABASE_SECRET_KEY=$(value SECRET_KEY)"
            echo "SUPABASE_RESUME_BUCKET=resumes"
            echo "OPENAI_API_KEY=ci-openai-key"
          } >> "$GITHUB_ENV"
      - run: npx supabase db reset --local
      - name: Verify canonical transactions, privacy and concurrency locally
        run: npm run test:aa2:local
      - name: Verify job requirement transactions and privacy locally
        run: npm run test:aa3:local
      - name: Verify score diagnostics, ownership and history locally
        run: npm run test:aa4:local && npm run test:aa4:legacy
      - run: npm run benchmark:job-intelligence
      - name: Verify candidate-controlled authoring locally
        run: npm run test:aa5:local
      - name: Verify owned, parsed-back PDF and DOCX exports locally
        run: npm run test:aa6:local
      - name: Verify populated canonical database restore locally
        run: npm run test:aa2:restore
        env:
          AA2_TEST_DB_CONTAINER: supabase_db_resume_ats
      - name: Verify opt-in document worker on synthetic local sources
        run: npm run test:aa1:worker
        env:
          EVIDENCE_REVIEW_ENABLED: "true"
      - run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  database:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run test:db
      - name: Verify historical and versioned field evidence contracts
        run: npx supabase db query --local --file scripts/verify-evidence-field-version.sql
      - run: npm run test:aa014:concurrency

  local-ocr:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build pinned synthetic-only OCR image
        id: build_ocr
        run: docker build --tag resumide-ocr:${{ github.sha }} scripts/ocr-runtime
      - name: Verify real selective OCR, isolation and cleanup
        shell: bash
        run: |
          ocr_image_id="$(docker image inspect resumide-ocr:${{ github.sha }} --format '{{.Id}}')"
          npm run test:ocr:local -- "$ocr_image_id"
      - name: Record development OCR diagnostics (not release acceptance)
        shell: bash
        run: |
          ocr_image_id="$(docker image inspect resumide-ocr:${{ github.sha }} --format '{{.Id}}')"
          npm run test:ocr:pilot -- "$ocr_image_id"
      - name: Verify normal-font development transcription (not release acceptance)
        shell: bash
        run: |
          ocr_image_id="$(docker image inspect resumide-ocr:${{ github.sha }} --format '{{.Id}}')"
          npm run test:ocr:pilot -- "$ocr_image_id" --print-pilot --partition=development --psm=3 --dpi=150 --require-quality

      - name: Verify encrypted and oversized-raster controls
        shell: bash
        run: |
          ocr_image_id="$(docker image inspect resumide-ocr:${{ github.sha }} --format '{{.Id}}')"
          npm run test:ocr:adverse -- "$ocr_image_id"
          npm run test:ocr:fields -- "$ocr_image_id"
      - name: Enforce development and locked synthetic extraction floors
        shell: bash
        run: |
          ocr_image_id="$(docker image inspect resumide-ocr:${{ github.sha }} --format '{{.Id}}')"
          npm run benchmark:extraction-v2:engineering -- "--image=$ocr_image_id"
          node node_modules/vite-node/vite-node.mjs --config vitest.config.ts scripts/benchmark-extraction-v2.ts --engineering --partition=locked --manifest-only "--image=$ocr_image_id" > locked-manifest.jsonl
          extraction_lock="$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("locked-manifest.jsonl","utf8").split("\n")[0]).manifestLock)')"
          node node_modules/vite-node/vite-node.mjs --config vitest.config.ts scripts/benchmark-extraction-v2.ts --engineering --partition=locked "--lock-receipt=$extraction_lock" "--image=$ocr_image_id" > locked-extraction-report.jsonl
      - name: Enforce additional frozen extraction regression floors
        if: ${{ !cancelled() && steps.build_ocr.outcome == 'success' }}
        shell: bash
        run: |
          ocr_image_id="$(docker image inspect resumide-ocr:${{ github.sha }} --format '{{.Id}}')"
          extraction_status=0
          node node_modules/vite-node/vite-node.mjs --config vitest.config.ts scripts/benchmark-extraction-v2.ts --engineering --corpus=repair-20261017 "--image=$ocr_image_id" > shared-development-extraction-report.jsonl || extraction_status=1
          for corpus in repair-20261017 confirmation-20261017 validation-20261017 verification-20261017 assessment-20261017 acceptance-20261017; do
            if ! node node_modules/vite-node/vite-node.mjs --config vitest.config.ts scripts/benchmark-extraction-v2.ts --engineering "--corpus=$corpus" --partition=locked --manifest-only "--image=$ocr_image_id" > "${corpus}-manifest.jsonl"; then
              extraction_status=1
              continue
            fi
            extraction_lock="$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],"utf8").split("\n")[0]).manifestLock)' "${corpus}-manifest.jsonl")"
            node node_modules/vite-node/vite-node.mjs --config vitest.config.ts scripts/benchmark-extraction-v2.ts --engineering "--corpus=$corpus" --partition=locked "--lock-receipt=$extraction_lock" "--image=$ocr_image_id" > "${corpus}-extraction-report.jsonl" || extraction_status=1
          done
          exit "$extraction_status"
      - name: Upload extraction acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-acceptance-receipts
          path: |
            locked-manifest.jsonl
            locked-extraction-report.jsonl
            repair-20261017-*.jsonl
            confirmation-20261017-*.jsonl
            validation-20261017-*.jsonl
            verification-20261017-*.jsonl
            assessment-20261017-*.jsonl
            acceptance-20261017-*.jsonl
            shared-development-extraction-report.jsonl
          if-no-files-found: ignore
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag resumide:${{ github.sha }} .
      - name: Scan production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: resumide:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
